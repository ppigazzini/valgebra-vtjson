name: CI

on:
  push:
    branches: [main, github_ci]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Take uv's build for every lane. uv otherwise prefers an interpreter the image
  # already has, which freezes that one lane at the distribution's patch while
  # its neighbours read uv's newest, so the matrix compares builds and not only
  # releases.
  UV_PYTHON_PREFERENCE: only-managed

jobs:
  differential:
    name: differential (vtjson parity, py${{ matrix.python-version }})
    runs-on: ubuntu-26.04
    strategy:
      # Every interpreter the classifiers claim. A version promised in the
      # metadata and absent from this list is a promise nothing keeps.
      #
      # `3.14t` and `3.15t` are free-threaded builds of versions already listed.
      # They are here as builds rather than versions: the translator keeps
      # per-thread state while it descends a schema, and under a GIL that state
      # is held still by the interpreter rather than by anything this project
      # does.
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.14t", "3.15", "3.15t"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      # libmagic backs the `magic` validator's differential test.
      - run: sudo apt-get update && sudo apt-get install -y libmagic1
      # `--locked` fails rather than re-resolving: the differential result is a
      # claim about the versions uv.lock records, including the pinned oracle.
      - name: Sync
        run: uv sync --locked
      # The layer must agree with pinned vtjson on every supported construct.
      # A new divergence without a ledger entry fails here.
      - name: Differential parity against pinned vtjson
        run: uv run --no-sync pytest -v --cov=vtjson_compat --cov-report=term-missing

  checks:
    name: lint, types, and benchmarks
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          # The newest release the classifiers claim, as the performance page
          # reads it and `ty` is told to.
          python-version: "3.15"
      - run: sudo apt-get update && sudo apt-get install -y libmagic1
      - name: Sync
        run: uv sync --locked
      - name: Lint
        run: |
          uv run --no-sync ruff check
          uv run --no-sync ruff format --check
          uv run --no-sync ty check
      # Smoke-run the vtjson-versus-valgebra benchmark with timing disabled so
      # the comparison suite keeps working; its numbers live in the performance
      # page. The files are named bench_*, so override the collection pattern.
      - name: Smoke-run the benchmarks
        run: >
          uv run --locked --group bench pytest benches/
          -o python_files="bench_*.py" --benchmark-disable -q
