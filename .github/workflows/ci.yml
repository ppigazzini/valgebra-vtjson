name: CI

on:
  push:
    branches: [main, github_ci]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  differential:
    name: differential (vtjson parity, py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      # Every interpreter the classifiers claim. A version promised in the
      # metadata and absent from this list is a promise nothing keeps.
      #
      # `3.14t` is the free-threaded build of a version already listed. It is
      # here as a build rather than a version: the translator keeps per-thread
      # state while it descends a schema, and under a GIL that state is held
      # still by the interpreter rather than by anything this project does.
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.14t"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      # libmagic backs the `magic` validator's differential test.
      - run: sudo apt-get update && sudo apt-get install -y libmagic1
      # `--locked` fails rather than re-resolving: the differential result is a
      # claim about the versions uv.lock records, including the pinned oracle.
      - name: Sync
        run: uv sync --locked
      # The layer must agree with pinned vtjson on every supported construct.
      # A new divergence without a ledger entry fails here.
      - name: Differential parity against pinned vtjson
        run: uv run --no-sync pytest -v --cov=vtjson_compat --cov-report=term-missing

  checks:
    name: lint, types, and benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - run: sudo apt-get update && sudo apt-get install -y libmagic1
      - name: Sync
        run: uv sync --locked
      - name: Lint
        run: |
          uv run --no-sync ruff check
          uv run --no-sync ruff format --check
          uv run --no-sync ty check
      # Smoke-run the vtjson-versus-valgebra benchmark with timing disabled so
      # the comparison suite keeps working; its numbers live in the performance
      # page. The files are named bench_*, so override the collection pattern.
      - name: Smoke-run the benchmarks
        run: >
          uv run --locked --group bench pytest benches/
          -o python_files="bench_*.py" --benchmark-disable -q
